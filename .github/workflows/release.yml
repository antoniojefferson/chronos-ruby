name: Release

on:
  push:
    tags:
      - "v0.*"
      - "v1.*"

permissions:
  contents: read

jobs:
  transitional-validation:
    uses: ./.github/workflows/ci-modern.yml

  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "2.4.22"
          bundler-cache: true
      - run: ruby script/verify_docs
      - run: ITERATIONS=10000 WARMUP=1000 bundle exec ruby benchmarks/query_analysis.rb
      - run: ITERATIONS=10000 WARMUP=1000 SAMPLES=5 bundle exec ruby benchmarks/comparative.rb
      - run: ITERATIONS=500 bundle exec ruby benchmarks/fake_endpoint_load.rb

  publish:
    needs: [transitional-validation, release-readiness]
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "2.4.22"
          bundler-cache: true
      - name: Update RubyGems
        run: gem update --system 3.4.22 --no-document
      - name: Verify tag and gem version
        run: |
          ruby -Ilib -rchronos/version -e '
            expected = "v#{Chronos::VERSION}"
            abort "Tag must be #{expected}" unless ENV["GITHUB_REF_NAME"] == expected
          '
      - run: bundle exec rake
      - run: gem build chronos-ruby.gemspec
      - name: Generate checksum and SBOM
        run: |
          sha256sum chronos-ruby-*.gem > "chronos-ruby-${GITHUB_REF_NAME#v}.gem.sha256"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" bundle exec ruby -Ilib script/generate_sbom
      - uses: actions/upload-artifact@v4
        with:
          name: chronos-ruby-${{ github.ref_name }}
          path: |
            chronos-ruby-*.gem
            chronos-ruby-*.gem.sha256
            chronos-ruby-*.spdx.json
      - name: Configure RubyGems trusted publishing credentials
        uses: rubygems/configure-rubygems-credentials@v2.1.0
      - name: Publish gem
        run: gem push chronos-ruby-*.gem
